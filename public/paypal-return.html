<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Payment Successful — TradeNest EA</title>
<meta name="robots" content="noindex" />
<style>
  html,body{margin:0;height:100%;background:radial-gradient(ellipse at 50% 0%,#1a0a10 0%,#050505 55%,#000 100%);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  .wrap{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 20px;text-align:center}
  .tick{width:88px;height:88px;border-radius:50%;border:2px solid rgba(74,222,128,.6);display:flex;align-items:center;justify-content:center;font-size:42px;color:#4ade80;box-shadow:0 0 40px rgba(74,222,128,.35);margin-bottom:18px}
  h1{font-size:20px;letter-spacing:2px;margin:0 0 8px}
  p{font-size:13px;color:rgba(255,255,255,.6);line-height:1.6;max-width:340px;margin:0 0 22px}
  a.btn{display:block;width:100%;max-width:340px;padding:16px 20px;border-radius:14px;background:linear-gradient(180deg,#ffc439,#f0a800);color:#0a1a2f;font-weight:900;text-decoration:none;box-shadow:0 10px 30px rgba(255,196,57,.35)}
  small{display:block;margin-top:16px;color:rgba(255,255,255,.32);font-size:11px}
</style>
</head>
<body>
  <div class="wrap">
    <div class="tick">✓</div>
    <h1>PAYMENT SUCCESSFUL</h1>
    <p>Thanks! Your TradeNest EA subscription is confirmed. We're opening the app and activating your access…</p>
    <a class="btn" id="open" href="/tradenest.html?paypal=success&amp;addbot=1">ADD LICENSE KEY</a>
    <small>If the app doesn't open automatically, tap the button above.</small>
  </div>
<script>
  (function () {
    try {
      localStorage.setItem('tn_paypal_returned', '1');
      localStorage.setItem('tn_open_add_robot', '1');
    } catch (e) {}
    var target = '/tradenest.html?paypal=success&addbot=1';
    // Try the native app deep link first (Android/iOS shell), then fall back to web.
    try { window.location.href = 'tradenest://paypal/success'; } catch (e) {}
    document.getElementById('open').setAttribute('href', target);
    setTimeout(function () { window.location.replace(target); }, 1200);
  })();
</script>
</body>
</html>
