<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#080808">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>TRADENEST EA</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.21.4/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rubik+Glitch&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #080808;
      color: #f0f0f0;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
      overscroll-behavior: none;
      position: fixed;
      width: 100%;
      height: 100%;
    }

    #root {
      width: 100%;
      height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: none;
    }

    .rubik-glitch { font-family: 'Rubik Glitch', cursive !important; }
    .font-orbitron { font-family: 'Orbitron', sans-serif !important; }

    /* Refined Animations */
    @keyframes scaleIn { from { transform: scale(0.97); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
    @keyframes breathe { 0%, 100% { transform: scale(1); opacity: 0.6; } 50% { transform: scale(1.04); opacity: 1; } }
    @keyframes dotPulse { 0%, 100% { transform: scale(1); opacity: 0.4; } 50% { transform: scale(1.1); opacity: 0.8; } }
    @keyframes splashFade { 0% { opacity: 1; } 85% { opacity: 1; } 100% { opacity: 0; pointer-events: none; } }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @keyframes splashLogoIn { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    @keyframes bot-live-breathe { 0%,100% { transform: scale(1); filter: saturate(1.15) contrast(1.05); } 50% { transform: scale(1.025); filter: saturate(1.35) contrast(1.1); } }
    @keyframes bot-scanline { 0% { background-position: 0% -110%; } 100% { background-position: 0% 210%; } }
    @keyframes bot-live-glow { 0%,100% { opacity: 0.7; } 50% { opacity: 1; } }

    /* "Live video" background effect — Ken Burns pan+zoom + animated aurora overlay */
    @keyframes tnBgPan { 0% { transform: scale(1.08) translate(0,0); } 50% { transform: scale(1.18) translate(-2%, -1%); } 100% { transform: scale(1.08) translate(0,0); } }
    @keyframes tnAurora { 0% { transform: translate(0,0) rotate(0deg); opacity:0.5; } 50% { transform: translate(2%,-3%) rotate(2deg); opacity:0.85; } 100% { transform: translate(0,0) rotate(0deg); opacity:0.5; } }
    div[style*="/bg-"], section[style*="/bg-"] { animation: tnBgPan 22s ease-in-out infinite; will-change: transform; }
    body::before { content:''; position:fixed; inset:-10%; z-index:0; pointer-events:none;
      background:
        radial-gradient(40% 30% at 20% 30%, rgba(255,45,85,0.20), transparent 60%),
        radial-gradient(35% 25% at 80% 70%, rgba(220,20,60,0.18), transparent 60%),
        radial-gradient(30% 20% at 60% 20%, rgba(255,80,120,0.14), transparent 60%);
      filter: blur(40px); animation: tnAurora 18s ease-in-out infinite; mix-blend-mode: screen; }

    
    /* Extra live bg effects — floating particles, chromatic drift */
    @keyframes tnFloat { 0%,100%{transform:translateY(0) translateX(0)} 50%{transform:translateY(-14px) translateX(6px)} }
    @keyframes tnDrift { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }
    body::after {
      content:'';
      position:fixed; inset:0; pointer-events:none; z-index:1;
      background:
        radial-gradient(2px 2px at 15% 20%, rgba(255,45,85,0.55), transparent 60%),
        radial-gradient(2px 2px at 80% 70%, rgba(34,211,238,0.45), transparent 60%),
        radial-gradient(1.5px 1.5px at 45% 85%, rgba(255,215,0,0.4), transparent 60%),
        radial-gradient(2px 2px at 65% 30%, rgba(255,45,85,0.4), transparent 60%),
        radial-gradient(1px 1px at 25% 60%, rgba(255,255,255,0.5), transparent 60%);
      background-size: 240px 240px, 320px 320px, 200px 200px, 280px 280px, 180px 180px;
      animation: tnFloat 9s ease-in-out infinite, tnDrift 22s linear infinite;
      mix-blend-mode: screen; opacity:0.55;
    }

    /* Neon color-cycling glow for chart scanner blocks (no stripes/lines) */
    @keyframes neonHue { 0% { filter: hue-rotate(0deg); } 100% { filter: hue-rotate(360deg); } }
    @keyframes neonFlash {
      0%,100% { box-shadow: 0 0 18px #FFD60099, 0 0 36px #FFD60055, inset 0 0 14px #FFD60044; border-color:#FFD600; }
      25%     { box-shadow: 0 0 22px #00E5FFcc, 0 0 48px #00E5FF88, inset 0 0 18px #00E5FF55; border-color:#00E5FF; }
      50%     { box-shadow: 0 0 24px #FF1F8Fcc, 0 0 52px #FF1F8F88, inset 0 0 20px #FF1F8F55; border-color:#FF1F8F; }
      75%     { box-shadow: 0 0 22px #7CFF6Bcc, 0 0 48px #7CFF6B88, inset 0 0 18px #7CFF6B55; border-color:#7CFF6B; }
    }
    .neon-hazard {
      position: relative;
      border: 1.5px solid #FFD600 !important;
      animation: neonFlash 3s ease-in-out infinite;
      background: linear-gradient(135deg, rgba(20,20,20,0.85), rgba(40,20,40,0.85)) !important;
    }
    .neon-hazard::before {
      content:''; position:absolute; inset:-2px; border-radius:inherit; pointer-events:none;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent);
      background-size: 200% 100%; animation: shimmer 2s linear infinite;
      mix-blend-mode: overlay; opacity: 0.7;
    }
    @keyframes iconAlert { 0%,100% { box-shadow: 0 0 18px #fff, 0 0 38px #00E5FF, 0 0 60px #FF1F8F; transform: scale(1); } 50% { box-shadow: 0 0 28px #fff, 0 0 60px #00E5FF, 0 0 90px #FF1F8F; transform: scale(1.08); } }
    .icon-alert { animation: iconAlert 0.9s ease-in-out infinite !important; }

    @keyframes splashTextIn { 0% { opacity: 0; transform: translateY(8px); letter-spacing: 10px; } 100% { opacity: 1; transform: translateY(0); letter-spacing: 8px; } }
    @keyframes splashBarFill { 0% { width: 0%; } 100% { width: 100%; } }
    @keyframes ringPulse { 0% { transform: scale(0.9); opacity: 0.3; } 50% { transform: scale(1.1); opacity: 0; } 100% { transform: scale(0.9); opacity: 0; } }
    @keyframes slideInRight { from { transform: translateX(100%); } to { transform: translateX(0); } }
    @keyframes slideInUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes glow { 0%, 100% { box-shadow: 0 0 15px var(--glow-color, rgba(255,45,85,0.2)); } 50% { box-shadow: 0 0 25px var(--glow-color, rgba(255,45,85,0.35)); } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    @keyframes shine { 0% { transform: translateX(-120%); } 100% { transform: translateX(120%); } }
    .animate-scale-in { animation: scaleIn 0.3s cubic-bezier(0.16,1,0.3,1); }
    .animate-fade-in { animation: fadeIn 0.3s ease-out; }
    .animate-fade-in-up { animation: fadeInUp 0.4s ease-out both; }
    .animate-pulse { animation: pulse 2s ease-in-out infinite; }
    .animate-slide-in-right { animation: slideInRight 0.35s cubic-bezier(0.16,1,0.3,1); }
    .animate-slide-in-up { animation: slideInUp 0.35s cubic-bezier(0.16,1,0.3,1); }

    /* Visual Effects */
    @keyframes rainFall { 0% { transform: translateY(-10vh) rotate(0deg); opacity:1; } 100% { transform: translateY(110vh) rotate(360deg); opacity:0; } }
    @keyframes floatUp { 0% { transform: translateY(100vh) scale(0.5); opacity:1; } 100% { transform: translateY(-10vh) scale(1.2); opacity:0; } }
    @keyframes lightning { 0%,100% { opacity:0; } 10% { opacity:1; } 20% { opacity:0; } 30% { opacity:0.8; } 40% { opacity:0; } }
    .effect-overlay { position:fixed; inset:0; z-index:300; pointer-events:none; overflow:hidden; }
    .effect-particle { position:absolute; animation-fill-mode:forwards; }
    @keyframes scanLine { 0% { top: 0%; } 100% { top: 100%; } }
    @keyframes scanPulse { 0%,100% { opacity:0.3; } 50% { opacity:1; } }
    @keyframes scanSweep { 0% { top: 8%; opacity:0.2; } 50% { opacity:1; } 100% { top: 92%; opacity:0.2; } }
    @keyframes symbolFloat { 0% { transform: translateY(-30px) rotate(0deg) scale(1); opacity:0; } 10% { opacity:0.6; } 50% { opacity:0.4; } 90% { opacity:0.15; } 100% { transform: translateY(115vh) rotate(90deg) scale(0.8); opacity:0; } }
    .symbol-rain-particle { position:absolute; font-weight:700; animation: symbolFloat linear forwards; pointer-events:none; }
    @keyframes lightningBolt { 0% { opacity:0; } 5% { opacity:1; } 10% { opacity:0.2; } 15% { opacity:0.9; } 25% { opacity:0; } 100% { opacity:0; } }
    @keyframes candleFall { 0% { transform: translateY(-60px) rotate(0deg); opacity:1; } 100% { transform: translateY(115vh) rotate(45deg); opacity:0; } }

    /* Glass */
    .glass { background: rgba(255,255,255,0.03); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border: 1px solid rgba(255,255,255,0.06); }
    .glass-strong { background: rgba(12,12,12,0.85); backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px); border: 1px solid rgba(255,255,255,0.08); }

    /* Modal */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex; align-items: center; justify-content: center;
      z-index: 100; padding: 20px;
    }

    /* Draggable Icon */
    .draggable-icon { position: fixed; z-index: 200; cursor: grab; touch-action: none; }
    .draggable-icon:active { cursor: grabbing; }

    /* Bottom Nav */
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(8,8,8,0.82);
      backdrop-filter: blur(40px);
      -webkit-backdrop-filter: blur(32px);
      border-top: 1px solid rgba(255,255,255,0.05);
      display: flex; justify-content: center; align-items: center;
      padding: 4px 0 env(safe-area-inset-bottom, 10px); z-index: 50;
    }
    .nav-btn {
      flex: 1; max-width: 110px;
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      padding: 8px 12px; background: transparent; border: none;
      color: rgba(255,255,255,0.28); font-family: 'Inter'; font-size: 9px; font-weight: 600;
      letter-spacing: 1.5px; cursor: pointer; transition: all 0.3s ease;
    }
    .nav-btn.active { color: #fff; }
    .nav-btn svg { transition: all 0.3s ease; }
    .nav-fire-btn {
      width: 52px; height: 52px; border-radius: 50%;
      border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      margin-top: -24px; transition: all 0.3s ease;
    }
    .nav-fire-btn:active { transform: scale(0.94); }

    /* Splash Screen */
    .splash-screen {
      position: fixed; inset: 0; z-index: 9999;
      background: #080808;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      animation: splashFade 3.5s ease-in-out forwards;
    }
    .splash-ring {
      position: absolute; border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.06);
      animation: ringPulse 2.5s ease-out infinite;
    }
    .splash-logo { animation: splashLogoIn 1s cubic-bezier(0.16,1,0.3,1) 0.2s both; z-index: 2; }
    .splash-title { animation: splashTextIn 0.8s ease-out 0.5s both; z-index: 2; }
    .splash-subtitle { animation: fadeInUp 0.6s ease-out 0.9s both; z-index: 2; }
    .splash-bar-container {
      width: 160px; height: 2px; background: rgba(255,255,255,0.05);
      border-radius: 4px; overflow: hidden; margin-top: 40px;
      animation: fadeIn 0.5s ease-out 1.2s both; z-index: 2;
    }
    .splash-bar {
      height: 100%; border-radius: 4px;
      animation: splashBarFill 2s ease-in-out 1.2s both;
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 4px; }

    /* === Live "human-like" robot idle animation ===
       Add className="tn-robot-live" to bot/mentor imgs so logos breathe/drift/blink. */
    @keyframes tnRobotBreathe {
      0%,100% { transform: translateY(0) scale(1) rotate(-0.4deg); filter: brightness(1); }
      25%     { transform: translateY(-2px) scale(1.015) rotate(0.5deg); filter: brightness(1.08); }
      50%     { transform: translateY(1px) scale(0.99) rotate(-0.6deg); filter: brightness(0.98); }
      75%     { transform: translateY(-1px) scale(1.008) rotate(0.3deg); filter: brightness(1.05); }
    }
    @keyframes tnRobotBlink {
      0%,92%,100% { opacity: 1; }
      94%,96%     { opacity: 0.72; }
    }
    .tn-robot-live {
      animation: tnRobotBreathe 4.6s ease-in-out infinite, tnRobotBlink 5.2s ease-in-out infinite;
      transform-origin: 50% 60%;
      will-change: transform, filter, opacity;
    }
    .tn-robot-live:hover { animation-duration: 2.4s, 3s; }

    /* Chart Scanner opts out of live background effects */
    [data-tn-scanner="1"], [data-tn-scanner="1"]::before, [data-tn-scanner="1"]::after {
      animation: none !important;
    }

    /* === Global background visibility ===
       When any background layer (video / image / robot fallback) is active,
       force the top-level page containers of every interface to transparent
       so the chosen bg is clearly visible behind cards & UI on every screen. */
    body.tn-has-bg .tn-app-page,
    body.tn-has-bg .tn-app-page > *,
    body.tn-has-bg .tn-app-page > * > div:first-child {
      background: transparent !important;
      background-color: transparent !important;
      background-image: none !important;
    }
    /* Chart Scanner keeps its own solid backdrop for readability */
    body.tn-has-bg [data-tn-scanner="1"],
    body.tn-has-bg [data-tn-scanner="1"] * {
      background-image: revert !important;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    // Subscription bypass removed — /api/public/check-subscription now hits the real portal
    // so email activation on tradenestea.com is enforced. Live licence + mentor data is
    // re-fetched on every app boot via the LicenseSync effect (see App component).


    const { useState, useEffect, useRef, useMemo, useCallback } = React;

    // ==========================================================================
    // MT5 API — MetaApi Cloud (metaapi.cloud) via server proxy /api/public/metaapi-trade
    // The auth token stays server-side. Every method returns { ok, data, error }.
    // ==========================================================================
    window.MT5API = (function(){
      const ENDPOINT = '/api/public/metaapi-trade';

      const post = async (payload) => {
        try {
          const resp = await fetch(ENDPOINT, {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify(payload),
          });
          const data = await resp.json().catch(() => ({}));
          if (!resp.ok || data.ok === false) {
            return { ok: false, data: data?.data ?? data, error: data?.error || `MetaApi ${resp.status}` };
          }
          return { ok: true, data: data.data ?? data, error: '' };
        } catch (e) {
          return { ok: false, data: null, error: e.message || String(e) };
        }
      };

      // Provision (or reuse) a MetaApi cloud account for the given broker creds,
      // then wait until it's DEPLOYED + CONNECTED. Returns { ok, data:{ id }, error }.
      const connect = async ({ login, password, server }) => {
        const r = await post({ action: 'provision', login, password, server, wait: true });
        if (!r.ok) return { ok: false, data: null, error: r.error };
        const id = r.data?.accountId || r.data?.id;
        if (!id) return { ok: false, data: null, error: 'MetaApi did not return an accountId.' };
        return { ok: true, data: { id, account: r.data?.account }, error: '' };
      };

      const account    = (accountId) => post({ action: 'account',   accountId });
      const positions  = (accountId) => post({ action: 'positions', accountId });
      const status     = (accountId) => post({ action: 'status',    accountId });

      const orderSend = async ({ id, symbol, direction, volume, stopLoss, takeProfit, comment = 'BOT' }) => {
        const r = await post({
          action: 'trade', accountId: id, symbol, direction, volume,
          stopLoss, takeProfit, comment,
        });
        if (!r.ok) return r;
        const t = r.data || {};
        const ticket = t.orderId || t.positionId || t.ticket || 'META';
        return { ok: true, data: { ticket, raw: t }, error: '' };
      };

      // Legacy no-ops (mtapi.io compatibility surface)
      const disconnect = async () => ({ ok: true, data: null, error: '' });
      const openOrders = (accountId) => positions(accountId);

      return {
        BASE: ENDPOINT, PROVIDER: 'metaapi',
        connect, disconnect, account, openOrders, positions, status, orderSend,
      };
    })();


    // ====== SVG Icons (clean, consistent stroke width) ======
    const HomeIcon = () => (<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>);
    const PlusIcon = () => (<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>);
    const PlayIcon = ({size=20,color="#fff"}) => (<svg width={size} height={size} viewBox="0 0 24 24" fill={color}><polygon points="6 3 20 12 6 21"/></svg>);
    const SquareIcon = ({size=20,color="white"}) => (<svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>);
    const SparklesIcon = ({color="white"}) => (<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="1.8" strokeLinecap="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>);
    const TrashIcon = () => (<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>);
    const XIcon = ({size=18}) => (<svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>);
    const ArrowLeftIcon = () => (<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>);
    const ArrowRightIcon = () => (<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>);
    const SettingsIcon = () => (<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>);
    const CheckIcon = ({size=20}) => (<svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><polyline points="20 6 9 17 4 12"/></svg>);
    const CrownIcon = () => (<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M2 4l3 12h14l3-12-5 4-5-4-5 4-5-4z"/><rect x="5" y="18" width="14" height="3" rx="1"/></svg>);
    const ClockIcon = () => (<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>);
    const CameraIcon = () => (<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>);
    const ChartIcon = () => (<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>);
    const LockIcon = () => (<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>);
    const MicIcon = () => (<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"><path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1"/><line x1="12" x2="12" y1="19" y2="22"/></svg>);

    // ====== Toast System ======
    const ToastContext = React.createContext(null);
    const ToastProvider = ({ children }) => {
      const [toasts, setToasts] = useState([]);
      const addToast = (t) => {
        const id = Date.now();
        setToasts(prev => [...prev, { ...t, id }]);
        setTimeout(() => setToasts(prev => prev.filter(x => x.id !== id)), 3000);
      };
      return (
        <ToastContext.Provider value={addToast}>
          {children}
          <div style={{ position:'fixed', top:16, left:'50%', transform:'translateX(-50%)', zIndex:999, display:'flex', flexDirection:'column', gap:8, width:'calc(100% - 32px)', maxWidth:380, pointerEvents:'none' }}>
            {toasts.map(t => (
              <div key={t.id} className="animate-slide-in-up" style={{
                background: t.variant === 'destructive' ? 'rgba(220,38,38,0.95)' : 'rgba(22,22,22,0.95)',
                backdropFilter:'blur(20px)',
                color:'white', padding:'14px 18px', borderRadius:14, maxWidth:'100%',
                boxShadow:'0 8px 40px rgba(0,0,0,0.4)',
                border: t.variant === 'destructive' ? '1px solid rgba(255,255,255,0.1)' : '1px solid rgba(255,255,255,0.08)',
                pointerEvents:'auto'
              }}>
                <div style={{fontWeight:600, fontSize:13, marginBottom:2}}>{t.title}</div>
                <div style={{opacity:0.7, fontSize:12, fontWeight:400}}>{t.description}</div>
              </div>
            ))}
          </div>
        </ToastContext.Provider>
      );
    };
    const useToast = () => React.useContext(ToastContext);

    // ====== Draggable Bot Icon ======
    const DraggableBotIcon = ({ image, name, onClose, onClick, tc, pulse, onPositionChange }) => {
      const initial = { x: 20, y: window.innerHeight - 160 };
      const posRef = useRef(initial);
      const [pos, setPos] = useState(initial);
      const draggingRef = useRef(false);
      const startRef = useRef({ x:0, y:0 });
      const offsetRef = useRef({ x:0, y:0 });
      const movedRef = useRef(false);
      const a = tc?.accent || '#ff2d55';
      const d = tc?.dark || '#8b0f2b';
      const g = tc?.glow || 'rgba(255,45,85,0.55)';
      const shortName = (name || 'BOT').toString().toUpperCase().slice(0, 12);

      useEffect(()=>{ onPositionChange?.(initial); /* eslint-disable-next-line */ }, []);

      const handleStart = (cx, cy) => { draggingRef.current = true; movedRef.current = false; startRef.current = {x:cx,y:cy}; offsetRef.current = posRef.current; };
      const handleMove = (cx, cy) => { if (!draggingRef.current) return; const dx=cx-startRef.current.x; const dy=cy-startRef.current.y; if(Math.abs(dx)>5||Math.abs(dy)>5) movedRef.current=true; const np={x:Math.max(0,Math.min(window.innerWidth-90,offsetRef.current.x+dx)),y:Math.max(0,Math.min(window.innerHeight-110,offsetRef.current.y+dy))}; posRef.current=np; setPos(np); onPositionChange?.(np); };
      const handleEnd = () => { draggingRef.current=false; };

      useEffect(() => {
        const mm=e=>handleMove(e.clientX,e.clientY); const mu=()=>handleEnd();
        const tm=e=>{if(draggingRef.current){e.preventDefault();handleMove(e.touches[0].clientX,e.touches[0].clientY);}}; const te=()=>handleEnd();
        window.addEventListener('mousemove',mm); window.addEventListener('mouseup',mu);
        window.addEventListener('touchmove',tm,{passive:false}); window.addEventListener('touchend',te);
        return()=>{window.removeEventListener('mousemove',mm);window.removeEventListener('mouseup',mu);window.removeEventListener('touchmove',tm);window.removeEventListener('touchend',te);};
      }, []);

      return (
        <div className="draggable-icon animate-scale-in" style={{left:pos.x,top:pos.y,zIndex:200,display:'flex',flexDirection:'column',alignItems:'center',gap:6,filter:`drop-shadow(0 6px 16px ${g})`}}
          onMouseDown={e=>handleStart(e.clientX,e.clientY)} onTouchStart={e=>handleStart(e.touches[0].clientX,e.touches[0].clientY)}
          onClick={()=>{ if(!movedRef.current) onClick?.(); }}>
          <div style={{position:'relative',width:78,height:78}}>
            {/* orbital rings */}
            <div style={{position:'absolute',inset:-6,borderRadius:'50%',border:`1.5px dashed ${a}66`,animation:'spin 8s linear infinite'}}/>
            <div style={{position:'absolute',inset:2,borderRadius:'50%',border:`1px solid ${a}44`,animation:'spin 14s linear infinite reverse'}}/>
            {/* live pulse */}
            <div style={{position:'absolute',inset:0,borderRadius:'50%',boxShadow:`0 0 0 0 ${a}66`,animation:'iconAlert 2s ease-out infinite'}}/>
            {/* avatar */}
            <div className={pulse?'icon-alert':''} style={{position:'absolute',inset:6,borderRadius:'50%',overflow:'hidden',background:`linear-gradient(135deg,${a},${d})`,border:`2px solid ${a}`,boxShadow:`0 0 18px ${g}, inset 0 0 14px rgba(0,0,0,0.35)`,display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',animation:'float 3.4s ease-in-out infinite'}}>
              {image ? <img src={image} alt="Bot" style={{width:'100%',height:'100%',objectFit:'cover'}}/> : <div style={{fontSize:28,color:'white'}}>🤖</div>}
              {/* shine sweep */}
              <div style={{position:'absolute',inset:0,background:'linear-gradient(115deg,transparent 40%,rgba(255,255,255,0.35) 50%,transparent 60%)',mixBlendMode:'overlay',animation:'shine 3.6s linear infinite'}}/>
            </div>
            {/* live dot */}
            <div style={{position:'absolute',right:-2,top:-2,width:14,height:14,borderRadius:'50%',background:'#22c55e',border:'2px solid #0a0a0a',boxShadow:'0 0 8px #22c55e',animation:'breathe 1.6s ease-in-out infinite'}}/>
          </div>
          {/* name badge */}
          <div style={{padding:'3px 10px',borderRadius:999,background:'rgba(8,10,18,0.85)',border:`1px solid ${a}55`,backdropFilter:'blur(8px)',boxShadow:`0 4px 14px ${g}`,display:'flex',alignItems:'center',gap:5,maxWidth:120}}>
            <span style={{width:5,height:5,borderRadius:'50%',background:a,boxShadow:`0 0 6px ${a}`}}/>
            <span style={{fontFamily:'Orbitron',fontSize:9,fontWeight:900,letterSpacing:1.5,color:'#fff',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{shortName}</span>
          </div>
        </div>
      );
    };


    // ====== Signal Trade Panel ======
    const SignalTradePanel = ({ signal, onExecute, onDismiss, tc, botName, botImage }) => {
      const a = tc?.accent || '#ff2d55';
      const d = tc?.dark || '#8b0f2b';
      const g = tc?.glow || 'rgba(255,45,85,0.5)';
      const isBuy = signal.direction === 'BUY';
      return (
        <div style={{position:'fixed',inset:0,zIndex:160,display:'flex',alignItems:'flex-end',justifyContent:'center',background:'rgba(0,0,0,0.7)',backdropFilter:'blur(8px)'}} className="animate-fade-in">
          <div style={{width:'100%',maxWidth:480,background:'#0c0c0c',borderRadius:'20px 20px 0 0',border:`1px solid ${a}40`,boxShadow:`0 -10px 60px ${g}, 0 -4px 20px rgba(0,0,0,0.8)`,overflow:'hidden',paddingBottom:'env(safe-area-inset-bottom,16px)'}} className="animate-slide-in-up">
            {/* Signal header */}
            <div style={{padding:'12px 20px',background:`linear-gradient(135deg,${a}25,${d}18)`,borderBottom:`1px solid ${a}22`,display:'flex',alignItems:'center',gap:10}}>
              <div style={{width:36,height:36,borderRadius:'50%',overflow:'hidden',background:`linear-gradient(135deg,${a},${d})`,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                {botImage ? <img src={botImage} alt="" style={{width:'100%',height:'100%',objectFit:'cover'}}/> : <span style={{fontSize:16}}>🤖</span>}
              </div>
              <div style={{flex:1}}>
                <div style={{display:'flex',alignItems:'center',gap:6}}>

                  <span style={{fontFamily:'Orbitron',fontSize:9,color:'#22c55e',letterSpacing:2,fontWeight:700}}>LIVE SIGNAL</span>

            </div>

            <div style={{padding:'20px 20px 10px'}}>
              {/* Direction badge */}
              <div style={{display:'flex',justifyContent:'center',marginBottom:16}}>
                <span style={{padding:'10px 40px',borderRadius:12,fontFamily:'Orbitron',fontWeight:800,fontSize:22,letterSpacing:4,color:'white',background:isBuy?'linear-gradient(135deg,#22c55e,#16a34a)':'linear-gradient(135deg,#ef4444,#dc2626)',boxShadow:isBuy?'0 4px 20px rgba(34,197,94,0.4)':'0 4px 20px rgba(239,68,68,0.4)'}}>

                  {l:'SL',v:signal.sl||'None',c:'#ef4444'},

                <button onClick={()=>onExecute(signal)} style={{flex:2,padding:'14px 0',borderRadius:12,background:isBuy?'linear-gradient(135deg,#22c55e,#16a34a)':'linear-gradient(135deg,#ef4444,#dc2626)',border:'none',color:'white',fontFamily:'Orbitron',fontSize:13,fontWeight:800,letterSpacing:2,cursor:'pointer',boxShadow:isBuy?'0 4px 20px rgba(34,197,94,0.35)':'0 4px 20px rgba(239,68,68,0.35)'}}>
                  EXECUTE {signal.direction}
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    };

    // ====== Bot Status Popup — Dark Knight console ======
    const BotStatusPopup = ({ botName, botImage, onStop, tc, logs, isOnline, iconPos, onOpenPairs, onOpenLogs, onSwitchBot }) => {
      const a = tc?.accent || '#22d3ee';
      const cyan = '#22d3ee';
      const amber = '#ffb23f';
      const green = '#22c55e';
      const red = '#ff454d';
      const displayName = (botName || 'Trading Robot');
      const online = isOnline !== false;
      const tradeLogs = logs || [];

      const W = Math.min(320, window.innerWidth - 20);
      const H = Math.min(480, window.innerHeight - 24);
      const ix = iconPos?.x ?? 20;
      const iy = iconPos?.y ?? (window.innerHeight - 160);
      let top = iy - H - 12;
      if (top < 12) top = iy + 78;
      let left = ix + 32 - W / 2;
      left = Math.max(8, Math.min(window.innerWidth - W - 8, left));

      // Build EAConnect-style >> log stream
      const lines = [];
      lines.push({ k:'ok',   t:'CONNECTED TO TRADE SERVER' });
      if (!online) {
        lines.push({ k:'err',  t:'CONNECTION ERROR' });
        lines.push({ k:'err',  t:'DISCONNECTED FROM TRADE SERVER' });
      }
      lines.push({ k:'ok',    t:'Connected to trade server' });
      lines.push({ k:'muted', t:`${displayName} trading` });
      tradeLogs.slice(-8).forEach(log => {
        if (log.step) { lines.push({ k:'muted', t:log.step }); return; }
        const dir = (log.action||'').toUpperCase() === 'SELL' ? 'Sell' : 'Buy';
        const sym = (log.pair || 'XAUUSD').toUpperCase();
        const lot = log.lot ?? '0.01';
        lines.push({ k:'open',  t:`OPEN ${dir}: ${sym} ${lot}` });
        if (log.entry != null) lines.push({ k:'entry', t:`ENTRY @ ${log.entry}` });
      });

      const colorFor = (k) => k==='ok' ? green
        : k==='err' ? red
        : k==='open' ? cyan
        : k==='entry' ? amber
        : 'rgba(255,255,255,0.72)';

      return (

              {/* Name overlay bottom-left */}
              <div style={{position:'absolute',left:14,bottom:38,right:14}}>
                <p style={{color:'white',fontSize:20,fontWeight:900,letterSpacing:0.5,margin:0,fontFamily:'Orbitron,sans-serif',textShadow:'0 2px 8px rgba(0,0,0,0.9)'}}>{displayName}</p>
                {!online && <p style={{color:red,fontSize:11,fontWeight:900,letterSpacing:2,margin:'2px 0 0',fontFamily:'Orbitron,sans-serif'}}>DISCONNECTED</p>}
              </div>
              {/* Status pills */}
              <div style={{position:'absolute',left:14,bottom:10,display:'flex',gap:8}}>
                <span style={{display:'inline-flex',alignItems:'center',gap:5,padding:'5px 11px',borderRadius:999,background:'rgba(34,197,94,0.14)',border:`1px solid ${green}88`,color:green,fontFamily:'Orbitron,sans-serif',fontSize:9,fontWeight:900,letterSpacing:1.2}}>
                  <span style={{width:6,height:6,borderRadius:'50%',background:green,boxShadow:`0 0 8px ${green}`}}/> TRADING ACTIVE
                </span>
                <span style={{display:'inline-flex',alignItems:'center',padding:'5px 11px',borderRadius:999,background:'rgba(34,211,238,0.14)',border:`1px solid ${cyan}88`,color:cyan,fontFamily:'Orbitron,sans-serif',fontSize:9,fontWeight:900,letterSpacing:1.2}}>ROBOT ACTIVATED</span>
              </div>
            </div>

            {/* Console log */}
            <div style={{background:'#000',padding:'12px 14px 10px',fontFamily:'Menlo, Consolas, monospace',display:'flex',flexDirection:'column',gap:3,maxHeight:220,overflowY:'auto'}}>
              {lines.map((l,i)=>(
                <p key={i} style={{fontSize:11,lineHeight:1.35,fontWeight:600,margin:0,color:colorFor(l.k),letterSpacing:0.3,textShadow:l.k==='open'||l.k==='entry'?`0 0 6px ${colorFor(l.k)}55`:'none'}}>
                  <span style={{color:'rgba(255,255,255,0.35)',marginRight:6}}>&gt;&gt;</span>{l.t}
                </p>
              ))}
              <p style={{textAlign:'right',color:cyan,fontFamily:'Orbitron,sans-serif',fontSize:9,fontWeight:900,letterSpacing:2,margin:'8px 0 0',opacity:0.85}}>POWERED BY TRADENEST EA</p>
            </div>
          </div>

          {/* Footer pill */}

    // ====== Bot Switcher (full-screen modal — pick a robot, auto start/stop) ======

                      <div style={{color:'rgba(255,255,255,0.45)',fontSize:11,marginTop:2}}>{ea.name && ea.name !== ea.mentorName ? ea.name : (ea.broker || 'License key')}</div>
                    </div>
                    {running && <div style={{display:'flex',alignItems:'center',gap:5}}>
                      <div style={{width:7,height:7,borderRadius:'50%',background:a,boxShadow:`0 0 8px ${a}`,animation:'breathe 1.4s ease-in-out infinite'}}/>
                      <span style={{color:a,fontSize:9,fontWeight:900,letterSpacing:1.5,fontFamily:'Orbitron,sans-serif'}}>LIVE</span>
                    </div>}
                    {active && !running && <span style={{color:a,fontSize:10,fontWeight:800,letterSpacing:1.5}}>SELECTED</span>}
                  </button>
                );
              })}
            </div>
          </div>
        </div>
      );
    };

    // ====== Side Drawer (swipe-in hamburger) ======
    const SideDrawer = ({ activeTab, onTabChange, tc }) => {
      const a = tc?.accent || '#ff2d55';
      const d = tc?.dark || '#8b0f2b';
      const g = tc?.glow || 'rgba(255,45,85,0.4)';
      const [open, setOpen] = useState(false);
      const touch = useRef({x:0,y:0,active:false});

      useEffect(()=>{
        const onStart = (e)=>{
          const t = e.touches[0]; if(!t) return;

    // ====== Execution Flow ======

      const progress = seconds / TOTAL, dashOffset = circumference * (1 - progress);
      const minutes = Math.floor(seconds / 60);
      const secs = seconds % 60;
      const angle = progress * 2 * Math.PI - Math.PI / 2;
      const dotX = 100 + radius * Math.cos(angle), dotY = 100 + radius * Math.sin(angle);
      const td = tradeData || {};
      const sym = td.symbol || 'XAUUSDm';
      const dir = td.direction || 'buy';
      const entry = td.entry || '5090.67';
      const lot = td.lotSize || '0.01';

        <div style={{position:'fixed',inset:0,zIndex:100,display:'flex',flexDirection:'column',background:'#ff2d55'}}>

    // ====== MetaTrader View ======
    const MetaTraderView = ({ isVIP, themeColor }) => {
      const [activeTab, setActiveTab] = useState('mt5');
      const [showPw, setShowPw] = useState(false);
      const [loading, setLoading] = useState(false);
      const toast = useToast();
      const [form, setForm] = useState(()=>{try{const s=localStorage.getItem('mt_credentials_mt5');return s?JSON.parse(s):{login:'',password:'',server:''};}catch{return{login:'',password:'',server:''};}});
      const [connected, setConnected] = useState(()=>{try{return localStorage.getItem('mt_connected_mt5')==='true';}catch{return false;}});
      const [accountId, setAccountId] = useState(()=>{try{return localStorage.getItem('mt_accountId_mt5')||'';}catch{return '';}});
      const [accountInfo, setAccountInfo] = useState(null);
      const [loadingInfo, setLoadingInfo] = useState(false);
      const [showServerList, setShowServerList] = useState(false);
      const [expandedBroker, setExpandedBroker] = useState(null);

      const BROKER_GROUPS = useMemo(()=>{
        const platLabel = activeTab.toUpperCase(); // MT4 or MT5
        const exness = [`Exness-${platLabel}Real`,`Exness-${platLabel}Trial`];
        for (let i=1;i<=46;i++) exness.push(`Exness-${platLabel}Real${i}`);
        for (let i=1;i<=17;i++) exness.push(`Exness-${platLabel}Trial${i}`);
        return [
          { broker:'Exness', servers: exness },
          { broker:'JustMarkets', servers:['JustMarkets-Demo','JustMarkets-Demo2','JustMarkets-Demo3','JustMarkets-Live','JustMarkets-Live2','JustMarkets-Live3','JustMarketsCY-Demo','JustMarketsCY-Live'] },
          { broker:'Trade245Global', servers:['Trade245Global-Live'] },
          { broker:'RazorMarkets', servers:['RazorMarkets-Live'] },
        ];
      },[activeTab]);
      const filteredGroups = useMemo(()=>{
        const q = (form.server||'').toLowerCase().trim();
        if (!q) return BROKER_GROUPS.map(g=>({...g, servers: expandedBroker===g.broker ? g.servers : []}));
        return BROKER_GROUPS.map(g=>{
          if (g.broker.toLowerCase().includes(q)) return { ...g, servers: g.servers };
          const matches = g.servers.filter(s=>s.toLowerCase().includes(q));
          return matches.length ? { ...g, servers: matches } : null;
        }).filter(Boolean);
      },[form.server, BROKER_GROUPS, expandedBroker]);



      const switchTab = (t) => { localStorage.setItem(`mt_credentials_${activeTab}`,JSON.stringify(form)); localStorage.setItem(`mt_connected_${activeTab}`,connected.toString()); localStorage.setItem(`mt_accountId_${activeTab}`,accountId); setActiveTab(t); try{const s=localStorage.getItem(`mt_credentials_${t}`);setForm(s?JSON.parse(s):{login:'',password:'',server:''});setConnected(localStorage.getItem(`mt_connected_${t}`)==='true');setAccountId(localStorage.getItem(`mt_accountId_${t}`)||'');setAccountInfo(null);}catch{setForm({login:'',password:'',server:''});setConnected(false);setAccountId('');setAccountInfo(null);} };

      // ---- MT5 only. All requests go through window.MT5API ----
      const DEFAULT_MANAGER_API = window.MT5API.BASE; // https://mt5.mtapi.io
      const [managerUrl, setManagerUrl] = useState(DEFAULT_MANAGER_API);
      const managerBase = () => window.MT5API.BASE;

      const getStoredLogin = (accountId) => {
        try { return localStorage.getItem(`mt_login_for_${accountId}`) || localStorage.getItem(`mt_login_${activeTab}`) || ''; } catch { return ''; }
      };

      // Unified action dispatcher — returns raw data or throws with the friendly error.
      const callMetaAPI = async (action, params = {}) => {
        if (action === 'listAccounts') return [];
        if (action === 'deploy') return { ok: true };

        if (action === 'provision') {
          const r = await window.MT5API.connect({
            login: params.login, password: params.password, server: params.server,
          });
          if (!r.ok) {
            const suffix = r.error && !/verify|server/i.test(r.error)
              ? ' Verify the exact broker server name and that this MT5 login belongs to that server.'
              : '';
            throw new Error(`${r.error || 'Connection failed.'}${suffix}`);
          }
          return { id: r.data.id, _id: r.data.id, platform: 'mt5', ...r.data };
        }

        if (action === 'getAccountInfo') {
          const r = await window.MT5API.account(params.accountId);
          if (!r.ok) throw new Error(r.error || 'Failed to load account info.');
          return r.data;
        }

        if (action === 'trade') {
          const r = await window.MT5API.orderSend({
            id: params.accountId, symbol: params.symbol,
            direction: params.actionType, volume: params.volume,
            stopLoss: params.stopLoss, takeProfit: params.takeProfit,
            comment: params.botName || 'BOT',
          });
          if (!r.ok) throw new Error(r.error || 'OrderSend failed.');
          return { ticket: r.data.ticket };
        }

        throw new Error(`Unknown action: ${action}`);
      };

      const friendlyError = (msg) => msg ? String(msg) : 'Connection failed. Please try again.';



      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!form.login || !form.password || !form.server) return;
        try{ localStorage.setItem('mt_manager_api_url', managerBase()); }catch(_){}

        setLoading(true);
        try {
          let aid = '';

          // Step 1: Provision (or reuse) MetaApi cloud account for these creds
          toast({ title: 'Provisioning…', description: 'Setting up MetaApi cloud account (this can take up to 90s the first time)…' });
          const provResult = await callMetaAPI('provision', {
            login: form.login, password: form.password, server: form.server, platform: activeTab
          });
          aid = provResult.id || provResult._id;
          if (!aid) throw new Error('MetaApi did not return an accountId.');

          setAccountId(aid);
          setConnected(true);
          localStorage.setItem(`mt_credentials_${activeTab}`, JSON.stringify(form));
          localStorage.setItem(`mt_connected_${activeTab}`, 'true');
          localStorage.setItem(`mt_accountId_${activeTab}`, aid);
          localStorage.setItem(`mt_platform_for_${aid}`, activeTab);
          localStorage.setItem(`mt_login_${activeTab}`, form.login);
          localStorage.setItem(`mt_login_for_${aid}`, form.login);
          toast({ title: 'Account Linked!', description: `${activeTab.toUpperCase()} account connected via MetaApi Cloud.` });

          // Try to fetch account info
          try {
            const info = await callMetaAPI('getAccountInfo', { accountId: aid, login: form.login });
            setAccountInfo(info);
            try{localStorage.setItem('mt_account_info', JSON.stringify({...info, platform: activeTab}));}catch(_){}
          } catch (e) {
            // Retry after delay
            setTimeout(async () => {
              try {
                const info = await callMetaAPI('getAccountInfo', { accountId: aid, login: form.login });
                setAccountInfo(info);
                try{localStorage.setItem('mt_account_info', JSON.stringify({...info, platform: activeTab}));}catch(_){}
              } catch (e2) { /* still connecting */ }
            }, 8000);
          }
        } catch (err) {
          const friendly = friendlyError(err.message);
          toast({ title: 'Connection Failed', description: friendly, variant: 'destructive' });
        }
        setLoading(false);
      };

      const fetchAccountInfo = async () => {
        if (!accountId) return;
        const login = form.login || getStoredLogin(accountId);
        if (!login) { toast({ title: 'Error', description: 'No login stored for this account.', variant: 'destructive' }); return; }
        setLoadingInfo(true);
        try {
          const info = await callMetaAPI('getAccountInfo', { accountId, login });
          setAccountInfo(info);
          try{localStorage.setItem('mt_account_info', JSON.stringify({...info, platform: activeTab}));}catch(_){}
        } catch (err) {
          toast({ title: 'Error', description: err.message, variant: 'destructive' });
        }
        setLoadingInfo(false);
      };

      const handleDisconnect = () => {
        setConnected(false); setAccountId(''); setAccountInfo(null); try{localStorage.removeItem('mt_account_info');}catch(_){}
        localStorage.removeItem(`mt_connected_${activeTab}`);
        localStorage.removeItem(`mt_accountId_${activeTab}`);
        toast({ title: 'Disconnected', description: 'Account unlinked.' });
      };

      const tc = themeColor || (isVIP ? colorMap.blue : colorMap.graphite);
      const a = tc.accent;
      const d = tc.dark;
      const g = tc.glow;

      return (
        <div style={{minHeight:'calc(100vh - 80px)',display:'flex',flexDirection:'column',alignItems:'stretch',paddingBottom:40,position:'relative',zIndex:5,'--mt-a':a,'--mt-glow-strong':g,'--mt-glow-soft':g.replace(/0\.\d+/, '0.18')}} className="animate-fade-in">

          <div style={{padding:'18px 14px 0',display:'flex',flexDirection:'column',gap:18,maxWidth:520,width:'100%',margin:'0 auto'}}>

            {/* MT5 only */}

            {/* MT ACCOUNT pill header */}
            <div style={{width:'100%',padding:'18px 22px',borderRadius:18,background:'rgba(10,10,14,0.78)',border:'1.5px solid var(--mt-a)',boxShadow:'0 0 22px var(--mt-glow-strong), inset 0 0 18px var(--mt-glow-soft)',textAlign:'center'}}>
              <span style={{color:'var(--mt-a)',fontFamily:'Orbitron',fontWeight:800,letterSpacing:4,fontSize:14}}>{activeTab.toUpperCase()} ACCOUNT</span>
            </div>

            {/* Status */}
            <div style={{display:'flex',alignItems:'center',justifyContent:'center',gap:10}}>
              <span style={{width:7,height:7,borderRadius:'50%',background:connected?'#22c55e':'#9ca3af',boxShadow:connected?'0 0 10px rgba(34,197,94,0.7)':'none'}}/>
              <span style={{fontFamily:'Orbitron',fontWeight:700,letterSpacing:3,fontSize:11,color:'rgba(255,255,255,0.85)',textTransform:'uppercase'}}>
                {connected ? `${activeTab.toUpperCase()} Connected` : `${activeTab.toUpperCase()} Disconnected`}
              </span>
              {connected && <button onClick={handleDisconnect} style={{marginLeft:4,background:'transparent',border:'none',cursor:'pointer',color:'#ef4444',fontSize:10,fontFamily:'Orbitron',fontWeight:700,letterSpacing:1}}>UNLINK</button>}
            </div>

            {/* Logo + label */}
            <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:14,marginTop:4}}>
              <div style={{position:'relative'}}>
                <div style={{position:'absolute',inset:-10,borderRadius:'50%',background:'radial-gradient(circle, var(--mt-glow-strong) 0%, transparent 70%)',filter:'blur(14px)',animation:'breathe 3s ease-in-out infinite'}}/>

        if (b.includes('exness')) return `${base}m`;                    // Exness micro
        if (b.includes('fbs')) return base;                             // plain
        if (b.includes('hfm') || b.includes('hotforex')) return base;
        if (b.includes('icmarkets')) return base;
        if (b.includes('pepperstone')) return base;
        if (b.includes('fxpro')) return `${base}.a`;                    // FxPro cTrader-like
        if (b.includes('roboforex')) return base;
        if (b.includes('xm')) return `${base}`;                          // XM: plain (micro uses .micro)
        if (b.includes('admiral')) return base;
        if (b.includes('vantage')) return `${base}+`;                    // Vantage ECN
        if (b.includes('oanda')) return base;
        return base;
      };
      const pickBotSymbol = (ea) => {
        try {
          const listed = Array.isArray(ea?.symbols) && ea.symbols[0];
          if (listed) return listed; // already in broker format
          const broker = ea?.broker || detectConnectedBroker();
          return applyBrokerSuffix('XAUUSD', broker);
        } catch { return 'XAUUSD'; }
      };
      useEffect(() => {
        if (autoScanRanRef.current) return;
        if (!selectedEA) return;
        const botOn = showDraggableIcon || !!tradeDelayTimer;
        if (!botOn) { console.log('[AUTOSCAN] Bot is OFF — auto-scan disabled'); return; }
        // Only scan symbols the user activated in Quotes. If none, do nothing.
        const allowedList = Object.keys(allowedSymbols||{});
        if (allowedList.length === 0) { console.log('[AUTOSCAN] No allowed symbols — auto-scan disabled'); return; }
        autoScanRanRef.current = true;
        const broker = selectedEA?.broker || detectConnectedBroker();
        const FOCUS = allowedList; // strictly the user's allowed symbols from the EA
        const botName = (botSettings.name || selectedEA?.name || 'Mobi AI').toUpperCase();
        let cancelled = false;

        const scanOne = async (base) => {
          const rawSymbol = applyBrokerSuffix(base, broker);
          setScanBanner({ title: `${botName} · Sniper Scan ${base}`, subtitle: `Analysing ${base} · low DD sniper` });
          try {
            const resp = await fetch('/api/public/analyze-chart', {
              method:'POST', headers:{'Content-Type':'application/json'},
              body: JSON.stringify({ symbol: base, tradeStyle: 'day', orderType:'instant', trailStop:true, dataSource: 'candles', confidenceThreshold: 72, licenseKey: (typeof localStorage!=='undefined' ? localStorage.getItem('mobi_license_key') : null) })
            });
            const data = await resp.json().catch(()=>({}));
            if (data && (data.direction === 'BUY' || data.direction === 'SELL') && (data.confidence||0) >= 72) {
              setScanBanner({ title: `${botName} ${data.direction} ${base}`, subtitle: `Conf ${data.confidence}% · TP ${data.tp} · SL ${data.sl}` });
              try { sendPhoneNotification(`🎯 ${data.direction} ${base}`, `Conf ${data.confidence}% · TP ${data.tp} · SL ${data.sl}`); } catch(_) {}
              setPendingSignal({
                symbol: rawSymbol,
                direction: data.direction,
                tp: data.tp, sl: data.sl,
                orderType: data.orderType || 'instant',
                trailStart: data.trailStart, trailStep: data.trailStep,
                lotSize: (localStorage.getItem('customLot') || 0.01),
                platform: 'MT5',
                signalId: `auto-${base}-${Date.now()}`,
              });
              return true;
            }
          } catch(_) {}
          return false;
        };

        (async () => {
          for (const base of FOCUS) {
            if (cancelled) return;
            await scanOne(base);
            await new Promise(r=>setTimeout(r, 1500));
          }
          setTimeout(()=>setScanBanner(null), 3500);
          const iv = setInterval(async () => {
            if (cancelled) return clearInterval(iv);
            // Stop the loop if the bot has been switched off in the meantime
            const stillOn = showDraggableIcon || !!tradeDelayTimer;
            if (!stillOn) { console.log('[AUTOSCAN] Bot switched OFF — stopping loop'); clearInterval(iv); autoScanRanRef.current = false; return; }
            for (const base of FOCUS) { if (cancelled) return; await scanOne(base); await new Promise(r=>setTimeout(r,1200)); }
          }, 180000);
        })();

        return () => { cancelled = true; };
        // eslint-disable-next-line
      }, [selectedEA, showDraggableIcon, tradeDelayTimer, allowedSymbols]);

      const handleStartTrading = (ea) => {
        if(showDraggableIcon||tradeDelayTimer){
          if(tradeDelayTimer){clearInterval(tradeDelayTimer);setTradeDelayTimer(null);setTradeDelaySeconds(0);}
          setShowDraggableIcon(false);setShowExecution(false);setShowBotPopup(false);setTradingEA(null);
          toast({title:"Stopped",description:"Trading robot stopped."});
        } else {
          speakText("Trade will execute in 1 minute!");
          setShowDraggableIcon(true);setTradeDelaySeconds(60);
          const interval=setInterval(()=>{setTradeDelaySeconds(prev=>{if(prev<=1){clearInterval(interval);setTradeDelayTimer(null);handleExecutionComplete();setShowBotPopup(true);return 0;}return prev-1;});},1000);
          setTradeDelayTimer(interval);
          toast({title:"Scheduled",description:"Execution in 1 minute."});
        }
      };

      const handleFullStop = () => { setShowDraggableIcon(false); setShowBotPopup(false); setTradingEA(null); toast({title:"Stopped",description:"Trading robot stopped."}); };
      const handleSwitchEA = (ea) => {
        if (!ea || selectedEA?.id === ea.id) { setSelectedEA(ea); return; }
        const wasActive = showDraggableIcon || !!tradeDelayTimer;
        if (wasActive) {
          if (tradeDelayTimer) { clearInterval(tradeDelayTimer); setTradeDelayTimer(null); setTradeDelaySeconds(0); }
          setShowDraggableIcon(false); setShowExecution(false); setShowBotPopup(false); setTradingEA(null);
        }
        setSelectedEA(ea);
        toast({title:"Switched Robot", description:`Now using ${ea.name||'Robot'}.`});
        if (wasActive) { setTimeout(()=>handleStartTrading(ea), 200); }
      };
      const handleIconClick = () => { setShowBotPopup(p => !p); };
      const [iconPos, setIconPos] = useState({ x: 20, y: (typeof window!=='undefined'?window.innerHeight-160:600) });
      const callMetaAPIFromApp = async (action, params) => {
        if (action === 'trade') {
          const r = await window.MT5API.orderSend({
            id: params.accountId, symbol: params.symbol,
            direction: params.actionType, volume: params.volume,
            stopLoss: params.stopLoss, takeProfit: params.takeProfit,
            comment: botSettings?.name || 'BOT',
          });
          if (!r.ok) throw new Error(r.error || 'OrderSend failed.');
          return { ticket: r.data.ticket };
        }
        throw new Error(`Unknown action: ${action}`);
      };

      const handleExecutionComplete = async () => {
        setShowExecution(false); setShowDraggableIcon(true);
        const td = tradeData;
        // Do NOT execute a phantom XAUUSD 0.01 trade when there's no real tradeData.
        if (!td || !td.symbol || !td.direction) {
          setTradeData(null);
          return;
        }
        const { symbol, direction } = td;
        const tp = td.tp || 0;
        const sl = td.sl || 0;
        const lotSize = td.lotSize || 0.01;
        const platform = td.platform || 'MT5';
        await executeTrade({ symbol, direction, tp, sl, lotSize, platform });
        setExecutionLogs(prev => [...prev, { id: Date.now(), time: new Date().toLocaleString(), pair: symbol, action: direction, tp, sl, lot: lotSize, order: '#' + (309304330 + prev.length) }]);
        setTradeData(null);
      };

      const executeTrade = async ({ symbol, direction, tp, sl, lotSize, platform }) => {
        platform = 'MT5';
        const accountId = localStorage.getItem('mt_accountId_mt5') || '';
        const login = accountId ? (localStorage.getItem(`mt_login_for_${accountId}`) || localStorage.getItem('mt_login_mt5') || '') : '';
        if (accountId) {
          try {
            toast({ title: 'Executing Trade...', description: `Sending ${direction} ${symbol} via ${platform}...` });
            const actionType = direction === 'BUY' ? 'ORDER_TYPE_BUY' : 'ORDER_TYPE_SELL';
            await callMetaAPIFromApp('trade', {
              accountId, login, actionType, symbol,
              volume: parseFloat(lotSize) || 0.01,
              stopLoss: sl || undefined,
              takeProfit: tp || undefined,
              platform,
            });
            toast({ title: 'Trade Placed!', description: `${direction} ${lotSize} ${symbol} on ${platform}` });
            return true;
          } catch (err) {
            toast({ title: 'Trade Failed', description: err.message, variant: 'destructive' });
            return false;
          }
        } else {
          toast({ title: 'No Account Linked', description: `Link a ${platform} account in MetaTrader tab.`, variant: 'destructive' });
          return false;
        }
      };

      const pushStepLog = (step) => {
        setExecutionLogs(prev => [...prev, { id: Date.now()+Math.random(), time: new Date().toLocaleTimeString(), step }]);
      };
      const handleSignalExecute = async (signal) => {
        setPendingSignal(null);
        setShowDraggableIcon(true);
        setShowBotPopup(true);
        triggerIconPulse();
        sendPhoneNotification(`📡 New Signal: ${signal.direction} ${signal.symbol}`, `TP ${signal.tp} • SL ${signal.sl} • Lot ${signal.lotSize}`);
        // Seed step logs into the floating trade panel (no execute prompt)
        const steps = [
          'Accepting disclaimer...',
          'Linking account...',
          `Selecting symbol ${signal.symbol}`,
          `${signal.direction} ${signal.symbol === 'XAUUSD' ? 'GOLD' : signal.symbol}`,
          `TP ${signal.tp}`,
          `SL ${signal.sl}`,
        ];
        for (const s of steps) { pushStepLog(s); await new Promise(r=>setTimeout(r,250)); }
        const placed = await executeTrade(signal);
        if (placed && signal.signalId) {
          await markSignalRead(signal.signalId);
          seenSignalIdsRef.current.add(String(signal.signalId));
          localStorage.setItem('seenSignalIds', JSON.stringify(Array.from(seenSignalIdsRef.current)));
        }
        if (placed) setExecutionLogs(prev => [...prev, { id: Date.now(), time: new Date().toLocaleTimeString(), pair: signal.symbol, action: signal.direction, tp: signal.tp, sl: signal.sl, lot: signal.lotSize, entry: 'MARKET', order: '#' + (309304330 + prev.length) }]);
        else pushStepLog('Trade failed - link MetaTrader account and retry');
        if (signal.signalId) processingSignalIdsRef.current.delete(String(signal.signalId));
        triggerIconPulse();
      };
      // Auto-execute as soon as a new signal arrives — no prompt
      useEffect(() => { if (pendingSignal) { handleSignalExecute(pendingSignal); } /* eslint-disable-next-line */ }, [pendingSignal]);

      const handleSaveSettings = (name,image,video,iconImage) => {
        const s={name,image,video,iconImage}; setBotSettings(s); localStorage.setItem('botSettings',JSON.stringify(s));
        toast({title:"Saved",description:"Settings updated."});
      };

      // ===== Native Android Floating Bubble (system overlay) =====
      const nativeBubble = (() => {
        try {
          const cap = window.Capacitor;
          if (!cap || !cap.isNativePlatform || !cap.isNativePlatform()) return null;
          return cap.Plugins && cap.Plugins.FloatingBubble ? cap.Plugins.FloatingBubble : null;
        } catch { return null; }
      })();
      const imgToDataURL = (src) => new Promise((resolve) => {
        if (!src) return resolve('');
        if (src.startsWith('data:')) return resolve(src);
        try {
          const img = new Image(); img.crossOrigin = 'anonymous';
          img.onload = () => {
            const c = document.createElement('canvas'); c.width = 128; c.height = 128;
            c.getContext('2d').drawImage(img, 0, 0, 128, 128);
            try { resolve(c.toDataURL('image/png')); } catch { resolve(''); }
          };
          img.onerror = () => resolve('');
          img.src = src;
        } catch { resolve(''); }
      });
      useEffect(() => {
        if (!nativeBubble) return;
        let cancelled = false;
        (async () => {
          if (showDraggableIcon) {
            try {
              const perm = await nativeBubble.hasPermission();
              if (!perm.granted) { await nativeBubble.requestPermission(); return; }
              const iconBase64 = await imgToDataURL(botSettings.iconImage || botSettings.image || '');
              if (cancelled) return;
              await nativeBubble.show({ iconBase64 });
            } catch (e) { console.warn('Native bubble show failed', e); }
          } else {
            try { await nativeBubble.hide(); } catch {}
          }
        })();
        return () => { cancelled = true; };
      }, [showDraggableIcon, botSettings.iconImage, botSettings.image]);
      useEffect(() => {
        if (nativeBubble && iconPulse) { try { nativeBubble.pulse(); } catch {} }
      }, [iconPulse]);

      const renderContent = () => {
        switch(activeTab) {
          case 'home':
            if (interfaceMode==='vip') return <VIPHomeView eas={eas} selectedEA={selectedEA} setSelectedEA={handleSwitchEA} onAddEA={handleAddEA} onRemoveEA={handleRemoveEA} onStartTrading={handleStartTrading} showDraggableIcon={showDraggableIcon} botSettings={botSettings} onOpenSettings={()=>setIsSettingsModalOpen(true)} executionLogs={executionLogs} onColorChange={handleColorChange} themeColor={themeColor} onNavigate={setActiveTab} onStopTrading={handleFullStop} onSwitchMode={m=>{setInterfaceMode(m);localStorage.setItem('interfaceMode',m);}} onEffect={setActiveEffect} onOpenChartAnalyzer={handleOpenChartAnalyzer} allowedSymbols={allowedSymbols} onAllowedChange={handleAllowedChange}/>;
            if (interfaceMode==='still_pane') return <StillPaneProHomeView onOpenChartAnalyzer={handleOpenChartAnalyzer} buttonStyle={buttonStyle} eas={eas} selectedEA={selectedEA} setSelectedEA={handleSwitchEA} onAddEA={handleAddEA} onRemoveEA={handleRemoveEA} onStartTrading={handleStartTrading} showDraggableIcon={showDraggableIcon||!!tradeDelayTimer} botSettings={botSettings} onOpenSettings={()=>setIsSettingsModalOpen(true)} themeColor={themeColor} allowedSymbols={allowedSymbols} onAllowedChange={handleAllowedChange} scanBanner={scanBanner} onDismissScan={()=>setScanBanner(null)} customBgImage={customBgImage} customBgVideo={customBgVideo} backgroundSrc={activeBg}/>;
            if (interfaceMode==='sicario_nova') return <SicarioNovaHomeView onOpenChartAnalyzer={handleOpenChartAnalyzer} buttonStyle={buttonStyle} eas={eas} selectedEA={selectedEA} setSelectedEA={handleSwitchEA} onAddEA={handleAddEA} onRemoveEA={handleRemoveEA} onStartTrading={handleStartTrading} showDraggableIcon={showDraggableIcon||!!tradeDelayTimer} botSettings={botSettings} onOpenSettings={()=>setIsSettingsModalOpen(true)} themeColor={themeColor} allowedSymbols={allowedSymbols} onAllowedChange={handleAllowedChange}/>;
            if (interfaceMode==='specter_x') return <SpecterXProHomeView onOpenChartAnalyzer={handleOpenChartAnalyzer} buttonStyle={buttonStyle} eas={eas} selectedEA={selectedEA} setSelectedEA={handleSwitchEA} onAddEA={handleAddEA} onRemoveEA={handleRemoveEA} onStartTrading={handleStartTrading} showDraggableIcon={showDraggableIcon||!!tradeDelayTimer} botSettings={botSettings} onOpenSettings={()=>setIsSettingsModalOpen(true)} themeColor={themeColor} allowedSymbols={allowedSymbols} onAllowedChange={handleAllowedChange}/>;
            if (interfaceMode==='neuro_scalper') return <NeuroScalperHomeView onOpenChartAnalyzer={handleOpenChartAnalyzer} buttonStyle={buttonStyle} eas={eas} selectedEA={selectedEA} setSelectedEA={handleSwitchEA} onAddEA={handleAddEA} onRemoveEA={handleRemoveEA} onStartTrading={handleStartTrading} showDraggableIcon={showDraggableIcon||!!tradeDelayTimer} botSettings={botSettings} onOpenSettings={()=>setIsSettingsModalOpen(true)} themeColor={themeColor} allowedSymbols={allowedSymbols} onAllowedChange={handleAllowedChange}/>;
            if (interfaceMode==='holo_grid') return <HoloGridProHomeView onOpenChartAnalyzer={handleOpenChartAnalyzer} eas={eas} selectedEA={selectedEA} setSelectedEA={handleSwitchEA} onAddEA={handleAddEA} onRemoveEA={handleRemoveEA} onStartTrading={handleStartTrading} showDraggableIcon={showDraggableIcon||!!tradeDelayTimer} botSettings={botSettings} onOpenSettings={()=>setIsSettingsModalOpen(true)} themeColor={themeColor} allowedSymbols={allowedSymbols} onAllowedChange={handleAllowedChange}/>;
            if (interfaceMode==='quantum_neural') return <QuantumNeuralProHomeView onOpenChartAnalyzer={handleOpenChartAnalyzer} eas={eas} selectedEA={selectedEA} setSelectedEA={handleSwitchEA} onAddEA={handleAddEA} onRemoveEA={handleRemoveEA} onStartTrading={handleStartTrading} showDraggableIcon={showDraggableIcon||!!tradeDelayTimer} botSettings={botSettings} onOpenSettings={()=>setIsSettingsModalOpen(true)} themeColor={themeColor} allowedSymbols={allowedSymbols} onAllowedChange={handleAllowedChange}/>;
            if (interfaceMode==='nexus_pro') return <NexusProHomeView onOpenChartAnalyzer={handleOpenChartAnalyzer} eas={eas} selectedEA={selectedEA} setSelectedEA={handleSwitchEA} onAddEA={handleAddEA} onRemoveEA={handleRemoveEA} onStartTrading={handleStartTrading} showDraggableIcon={showDraggableIcon||!!tradeDelayTimer} botSettings={botSettings} onOpenSettings={()=>setIsSettingsModalOpen(true)} themeColor={themeColor} allowedSymbols={allowedSymbols} onAllowedChange={handleAllowedChange}/>;
            return <HomeView eas={eas} selectedEA={selectedEA} setSelectedEA={handleSwitchEA} onAddEA={handleAddEA} onRemoveEA={handleRemoveEA} onStartTrading={handleStartTrading} showDraggableIcon={showDraggableIcon||!!tradeDelayTimer} botSettings={botSettings} onOpenSettings={()=>setIsSettingsModalOpen(true)} onColorChange={handleColorChange} themeColor={themeColor} onNavigate={setActiveTab} onStopTrading={handleFullStop} onSwitchMode={m=>{setInterfaceMode(m);localStorage.setItem('interfaceMode',m);}} onEffect={setActiveEffect} onChangePic={img=>{const s={...botSettings,image:img};setBotSettings(s);localStorage.setItem('botSettings',JSON.stringify(s));}} tradeDelaySeconds={tradeDelaySeconds} onOpenChartAnalyzer={handleOpenChartAnalyzer} isListening={isListening} voiceTranscript={voiceTranscript} onToggleVoice={toggleVoiceListening} interfaceMode={interfaceMode} allowedSymbols={allowedSymbols} onAllowedChange={handleAllowedChange} cardShape={cardShape}/>;
          case 'metatrader': return <MetaTraderView isVIP={interfaceMode==='vip'} themeColor={themeColor}/>;
          case 'settings': return <SettingsView themeColor={themeColor} onColorChange={handleColorChange} themeName={themeName} currentFont={appFont} onFontChange={handleFontChange} onEffect={setActiveEffect} onOpenSettings={()=>setIsSettingsModalOpen(true)} onOpenChartAnalyzer={handleOpenChartAnalyzer} botSettings={botSettings} interfaceMode={interfaceMode} onInterfaceModeChange={m=>{setInterfaceMode(m);localStorage.setItem('interfaceMode',m);}} isListening={isListening} voiceTranscript={voiceTranscript} onToggleVoice={toggleVoiceListening} glassStyle={glassStyle} onGlassStyleChange={setGlassStyle} heroStyle={heroStyle} onHeroStyleChange={setHeroStyle} cardImage={cardImage} onCardImageChange={setCardImage} cardShape={cardShape} onCardShapeChange={setCardShape} textCase={textCase} onTextCaseChange={setTextCase} background={background} onBackgroundChange={setBackground} customBgImage={customBgImage} onCustomBgImage={setCustomBgImage} customBgVideo={customBgVideo} onCustomBgVideo={setCustomBgVideo} buttonStyle={buttonStyle} onButtonStyleChange={s=>{setButtonStyle(s);localStorage.setItem("buttonStyle",s);}}/>;
          default: return null;
        }
      };

      return (
        <div style={{minHeight:'100vh',background:'#080808',position:'relative',isolation:'isolate'}}>
          {/* Global appearance background — MUST sit BEHIND every interface (zIndex 0) */}
          {activeVideo && (
            <video key={activeVideo} src={activeVideo} autoPlay loop muted playsInline style={{position:'fixed',inset:0,width:'100%',height:'100%',objectFit:'cover',zIndex:0,opacity:1}}/>
          )}
          {!activeVideo && activeBg && (
            <div style={{position:'fixed',inset:0,backgroundImage:`url(${activeBg})`,backgroundSize:'cover',backgroundPosition:'center',zIndex:0,opacity:1}}/>
          )}
          {(activeBg || activeVideo) && (
            <div style={{position:'fixed',inset:0,background:'linear-gradient(180deg,rgba(8,8,8,0) 0%,rgba(8,8,8,0.15) 60%,rgba(8,8,8,0.4) 100%)',zIndex:1,pointerEvents:'none'}}/>
          )}
          

          {showSplash && <SplashScreen onComplete={()=>setShowSplash(false)}/>}
          {!showSplash && authStep==='welcome' && <WelcomeScreen onContinue={()=>setAuthStep('login')}/>}
          {!showSplash && authStep==='login' && <LoginScreen onBack={()=>setAuthStep('welcome')} onLogin={(p)=>{setUserProfile(p);localStorage.setItem('userProfile',JSON.stringify(p));setAuthStep('done');}}/>}
         {showDraggableIcon && <DraggableBotIcon image={botSettings.iconImage||botSettings.image||(tradingEA||selectedEA)?.image} name={botSettings.name||(tradingEA||selectedEA)?.name} onClose={handleFullStop} onClick={handleIconClick} tc={themeColor} pulse={iconPulse} onPositionChange={setIconPos}/>}

         {showBotPopup && showDraggableIcon && <BotStatusPopup botName={botSettings.name||(tradingEA||selectedEA)?.name||'Trading Robot'} botImage={botSettings.iconImage||botSettings.image||(tradingEA||selectedEA)?.image} onStop={handleFullStop} tc={themeColor} logs={executionLogs} isOnline={showDraggableIcon} iconPos={iconPos} onSwitchBot={eas.length>1?()=>setShowBotSwitcher(true):undefined}/>}
          <BotSwitcher open={showBotSwitcher} onClose={()=>setShowBotSwitcher(false)} eas={eas} selectedEA={selectedEA} isRunning={showDraggableIcon} tc={themeColor} onPick={(ea)=>{ setShowBotSwitcher(false); handleSwitchEA(ea); }}/>
          <VisualEffectsOverlay effect={activeEffect} onDone={()=>setActiveEffect(null)} themeColor={themeColor}/>
          <ChartAnalyzer isOpen={showChartAnalyzer} onClose={()=>setShowChartAnalyzer(false)} licenseSymbols={Object.keys(allowedSymbols||{}).filter(s => !selectedEA?.symbols?.length || selectedEA.symbols.includes(s))} licenseKey={selectedEA?.licenseKey||null} onExecute={async (r,sym,count=1)=>{
            setShowChartAnalyzer(false);
            setShowDraggableIcon(true); setShowBotPopup(true); triggerIconPulse();
            sendPhoneNotification(`🤖 AI Chart Execution: ${r.direction} ${sym} ×${count}`, `TP ${r.tp} • SL ${r.sl} • Lot ${r.lotSize}`);
            for (let i=1;i<=count;i++) {
              const steps = [`Trade ${i}/${count}: Accepting disclaimer...`,'Linking account...',`Selecting symbol ${sym}`,`${r.direction} ${sym==='XAUUSD'?'GOLD':sym}`,`TP ${r.tp}`,`SL ${r.sl}`];
              for (const s of steps) { pushStepLog(s); await new Promise(res=>setTimeout(res,200)); }
              await executeTrade({symbol:sym,direction:r.direction,tp:r.tp,sl:r.sl,lotSize:r.lotSize,platform:r.platform||'MT5'});
              setExecutionLogs(prev => [...prev, { id: Date.now()+i, time: new Date().toLocaleTimeString(), pair: sym, action: r.direction, tp: r.tp, sl: r.sl, lot: r.lotSize, order: '#' + (309304330 + prev.length) }]);
              triggerIconPulse();
            }
          }}/>
          
          <ColorPickerPanel isOpen={showColorPicker} onClose={()=>setShowColorPicker(false)} onColorChange={handleColorChange} currentColor={themeName} currentFont={appFont} onFontChange={handleFontChange} onEffect={setActiveEffect}/>
          <BotSettingsModal isOpen={isSettingsModalOpen} onClose={()=>setIsSettingsModalOpen(false)} interfaceMode={interfaceMode} onInterfaceModeChange={m=>{setInterfaceMode(m);localStorage.setItem("interfaceMode",m);}} buttonStyle={buttonStyle} onButtonStyleChange={s=>{setButtonStyle(s);localStorage.setItem("buttonStyle",s);}}/>
          {/* Global auto-scan notification banner — shows on every interface */}
          {scanBanner && !showChartAnalyzer && (
            <div style={{position:'fixed',top:'calc(env(safe-area-inset-top,0px) + 10px)',left:0,right:0,zIndex:400,display:'flex',justifyContent:'center',pointerEvents:'none'}}>
              <div style={{pointerEvents:'auto',width:'min(94%,460px)',background:'rgba(14,14,14,0.94)',backdropFilter:'blur(14px)',WebkitBackdropFilter:'blur(14px)',border:'1px solid rgba(255,255,255,0.09)',borderRadius:22,padding:'10px 14px',display:'flex',alignItems:'center',gap:12,boxShadow:'0 14px 40px rgba(0,0,0,0.5)'}} className="animate-fade-in">
                <div style={{position:'relative',width:38,height:38,flexShrink:0}}>
                  <div style={{position:'absolute',inset:0,borderRadius:'50%',border:'3px solid rgba(255,255,255,0.08)'}}/>
                  <div style={{position:'absolute',inset:0,borderRadius:'50%',border:'3px solid transparent',borderTopColor:'#22c55e',borderRightColor:'#22c55e',animation:'spin 1.1s linear infinite'}}/>
                </div>
                <div style={{flex:1,minWidth:0}}>
                  <p style={{color:'#fff',fontSize:13,fontWeight:700,lineHeight:1.2,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis',margin:0}}>{scanBanner.title || 'AI Scanning Markets…'}</p>
                  <p style={{color:'rgba(255,255,255,0.55)',fontSize:11,marginTop:2,margin:0}}>{scanBanner.subtitle || 'Analysing chart'}</p>
                </div>
                <button onClick={()=>setScanBanner(null)} style={{background:'rgba(255,255,255,0.08)',border:'none',width:26,height:26,borderRadius:'50%',color:'#fff',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',fontSize:14}}>×</button>
              </div>
            </div>
          )}
          <div className="tn-app-page" style={{position:'relative',zIndex:2,maxWidth:480,margin:'0 auto',paddingBottom:'calc(env(safe-area-inset-bottom,0px) + 24px)'}}>{renderContent()}</div>
          {!showSplash && authStep==='done' && <BottomTabBar activeTab={activeTab} onTabChange={setActiveTab} tc={themeColor}/>}

        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<ToastProvider><App/></ToastProvider>);
  </script>
</body>
</html>
